services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relayforge
      POSTGRES_PASSWORD: relayforge
      POSTGRES_DB: relayforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayforge -d relayforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://relayforge:relayforge@postgres:5432/relayforge
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgres://relayforge:relayforge@postgres:5432/relayforge
      JWT_SECRET: ${JWT_SECRET:?Create a .env file with a strong JWT_SECRET}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    environment:
      DATABASE_URL: postgres://relayforge:relayforge@postgres:5432/relayforge
      WORKER_POLL_MS: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
